<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmation — FixMate Home Services</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg hsp-navbar sticky-top" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-tools"></i> FixMate</a>
  </div>
</nav>

<section class="section-pad">
  <div class="container" style="max-width:760px">
    <div class="text-center mb-4">
      <i class="bi bi-check-circle-fill text-success" style="font-size:3rem"></i>
      <h1 class="h3 fw-bold mt-2">Booking received!</h1>
      <p class="text-muted">Your booking ID is <strong id="confirm-id">—</strong>. Keep it for reference.</p>
    </div>
    <div class="card p-4" id="confirm-details"></div>
    <div class="alert alert-warning demo-note mt-3"><i class="bi bi-exclamation-triangle"></i> This is a <strong>frontend demo booking</strong> — it was saved in this browser's local storage and has not been sent to any server.</div>
    <div class="d-flex gap-2 mt-3">
      <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-house"></i> Back to Home</a>
      <a id="view-booking-link" href="#" class="btn btn-navy"><i class="bi bi-receipt"></i> View booking details</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/customer.js"></script>
<script>
  // "View booking details" opens the same confirmation inline for demo purposes.
  (function(){var l=document.getElementById('view-booking-link');l.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});window.HSP.toast('The details above are your full booking record in this demo.');});})();
</script>
</body>
</html>
